<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA Agenda · Emitir convite</title><style>body{font:16px system-ui;background:#eef5ff;color:#102a50;margin:0}header{background:#0c2646;color:white;padding:20px}main{max-width:600px;margin:30px auto;background:white;padding:25px;border-radius:15px}label{display:block;margin:14px 0}input,select{box-sizing:border-box;width:100%;padding:12px;margin-top:5px}button{padding:13px;background:#086cf3;color:white;border:0;border-radius:8px}#link{overflow-wrap:anywhere}</style><header>AnnA One · Agenda Educacional · Testes</header><main><h1>Emitir convite institucional</h1><p>Convites individuais para administradores. Sem envio automático de e-mail nesta versão.</p><form id="form"><label>Instituição<select id="institution" required></select></label><label>Nome completo<input id="name" required maxlength="150"></label><label>E-mail<input id="email" type="email" required maxlength="254"></label><label>Validade<select id="hours"><option value="24">24 horas</option><option value="48" selected>48 horas</option><option value="168">7 dias</option></select></label><button id="submit" disabled>Gerar convite</button></form><p id="status" role="status">Verificando acesso…</p><div id="result" hidden><p>Convite criado. Copie o link para o destinatário.</p><a id="link" rel="noreferrer"></a></div></main><script>
const AUTH='https://ep-lingering-breeze-b6xo2cst.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth',API='https://ep-lingering-breeze-b6xo2cst.apirest.c-2.sa-east-1.aws.neon.tech/neondb/rest/v1',ISSUE='https://tnvghprwltbziivlxeod.supabase.co/functions/v1/anna-agenda-emitir-convite-test';let token='';const el=id=>document.getElementById(id),say=s=>el('status').textContent=s;
async function init(){try{const sr=await fetch(AUTH+'/get-session',{credentials:'include'}),s=await sr.json(),user=s?.user||s?.data?.user;if(!user?.id)throw Error('Entre pelo login institucional.');const tr=await fetch(AUTH+'/token',{credentials:'include'}),t=await tr.json();token=t?.token||t?.data?.token||t?.access_token;if(!token)throw Error('Sessão expirada.');const get=async p=>{const r=await fetch(API+p,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Consulta recusada');return r.json()};const ms=await get('/institution_memberships?select=institution_id,role&user_id=eq.'+encodeURIComponent(user.id)+'&active=eq.true');const ids=ms.filter(m=>m.role==='institution_admin').map(m=>m.institution_id);if(!ids.length)throw Error('Sem acesso de administrador.');const ins=await get('/institutions?select=id,name&id=in.('+ids.join(',')+')&active=eq.true');for(const i of ins){const o=document.createElement('option');o.value=i.id;o.textContent=i.name;el('institution').append(o)}if(!ins.length)throw Error('Instituição indisponível.');el('submit').disabled=false;say('Pronto para emitir convites.')}catch(e){say(e.message)}}init();
el('form').addEventListener('submit',async e=>{e.preventDefault();el('submit').disabled=true;el('result').hidden=true;say('Emitindo…');try{const r=await fetch(ISSUE,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({institution_id:el('institution').value,full_name:el('name').value.trim(),email:el('email').value.trim(),valid_hours:Number(el('hours').value)})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Falha na emissão');el('link').href=d.link;el('link').textContent=d.link;el('result').hidden=false;say('Convite emitido.')}catch(err){say(err.message)}finally{el('submit').disabled=false}});
</script></html>
