<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>AnnA Agenda | Definir nova senha</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#eaf7ff,#f7fbff);font:15px system-ui,Arial;color:#173052;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;width:min(100%,440px);padding:30px;border-radius:18px;box-shadow:0 12px 36px #1730521b}h1{margin:0 0 10px;font-size:24px}p{line-height:1.55;color:#50627a}label{display:block;margin:16px 0 5px;font-weight:700}input{width:100%;padding:12px;border:1px solid #c4d2e4;border-radius:9px;font:inherit}button{margin-top:20px;width:100%;background:#086cf3;color:white;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700}button:disabled{opacity:.6}a{color:#0759b3}#status{margin-top:16px}</style></head><body><main class="card"><h1>Definir nova senha</h1><p id="account">Você está redefinindo a senha da conta associada ao link recebido por e-mail.</p><form id="form"><label for="password">Nova senha (mínimo de 8 caracteres)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="save" type="submit">Salvar nova senha</button></form><p id="status" role="status"></p><a href="login.html">Voltar ao login</a></main><script>(()=>{'use strict';const AUTH='https://ep-lingering-breeze-b6xo2cst.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth',params=new URLSearchParams(location.search),token=params.get('token'),form=document.getElementById('form'),status=document.getElementById('status'),button=document.getElementById('save');if(!token){form.hidden=true;status.textContent='Link de recuperação ausente. Solicite outro no login institucional.';return;}history.replaceState(null,'',location.pathname);form.addEventListener('submit',async e=>{e.preventDefault();const pass=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(pass.length<8||pass!==confirm){status.textContent='Use pelo menos 8 caracteres e confirme a mesma senha.';return}button.disabled=true;status.textContent='Salvando nova senha…';try{const res=await fetch(AUTH+'/reset-password',{method:'POST',credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:pass,token})});const data=await res.json().catch(()=>({}));if(!res.ok||data.error)throw Error(data.error?.message||'Falha HTTP '+res.status);form.hidden=true;status.textContent='Senha alterada. Volte ao login institucional para entrar.'}catch(err){status.textContent='Não foi possível alterar a senha: '+err.message}finally{button.disabled=false}})})();</script></body></html>
