<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA Agenda · Produção editorial</title><link rel="stylesheet" href="../assets/anna-module.css"><style>body{font:16px system-ui;background:#f5f9ff;color:#0c2646;margin:0}header,main{padding:20px;max-width:1000px;margin:auto}header{background:#0c2646;color:white}section{background:white;padding:18px;border:1px solid #ccd9e8;border-radius:12px;margin:12px 0}label{display:block;margin:10px 0}textarea,select,input{box-sizing:border-box;width:100%;padding:10px;font:inherit}button{padding:10px;margin:5px;background:#086cf3;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media print{header,.no-print{display:none!important}section{border:0}body{background:white}}</style><header><img src="../assets/anna-symbol.svg" width="40" alt=""> AnnA Agenda · Produção editorial</header><main><p class="no-print"><a href="../administracao/">Administração</a> · <a href="../login.html">Entrar</a></p><p id="status" role="status"></p><section class="no-print"><label>Instituição<select id="institution"></select></label><button id="refresh">Atualizar</button></section><section id="editor" class="no-print" hidden><h2>Agenda do professor</h2><label>Atribuição<select id="assignment"></select></label><label>Data<input type="date" id="day"></label><div id="fields"></div><button id="save">Salvar rascunho</button><button id="submit" hidden>Enviar à revisão</button><button id="new">Novo</button></section><section class="no-print"><h2>Registros</h2><div id="entries"></div></section><section id="review" hidden><h2>Revisão e prévia individual</h2><div id="original"></div><div id="revision" class="no-print"></div><label class="no-print">Observação<textarea id="note"></textarea></label><div id="actions" class="no-print"></div><div id="paper"></div></section></main><script type="module">
const AUTH="https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth",BASE="https://anna-one-auditoria.elisonborg.workers.dev/v1/agenda/study-guides";
const $=id=>document.getElementById(id), names={classContent:"Conteúdo trabalhado",classActivity:"Atividade em classe",homeActivity:"Atividade para casa"};let token,selected=null,rows=[],manager=false;
function el(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
function fields(root,prefix,values={}){root.replaceChildren();for(const [key,label] of Object.entries(names)){const l=el("label",label,root),t=el("textarea","",l);t.id=prefix+key;t.rows=4;t.value=values[key]||""}}
function values(prefix){return Object.fromEntries(Object.keys(names).map(k=>[k,$(prefix+k).value]))}
function option(root,value,label){const o=el("option",label,root);o.value=value}
async function api(path="",method="GET",body){const u=new URL(BASE+path);if($("institution").value)u.searchParams.set("institution_id",$("institution").value);const r=await fetch(u,{method,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||"Falha");return d}
async function run(fn){try{$("status").textContent="";await fn()}catch(e){$("status").textContent=e.message}}
function reset(){selected=null;$("submit").hidden=true;$("assignment").disabled=false;$("day").disabled=false;fields($("fields"),"f")}
async function load(){const d=await api("/daily-entries");manager=d.manager;rows=d.entries;$("assignment").replaceChildren();for(const a of d.assignments)option($("assignment"),a.id,a.grade+" "+a.classroom+" · "+a.subject);$("editor").hidden=!d.assignments.length;reset();$("review").hidden=true;$("entries").replaceChildren();for(const a of rows){const b=el("button",a.agenda_date+" · "+a.grade+" "+a.classroom+" · "+a.subject+" · "+a.status,$("entries"));b.onclick=()=>open(a)}}
function open(a){selected=a;if(["draft","needs_clarification"].includes(a.status)&&Array.from($("assignment").options).some(o=>o.value===a.assignment_id)){$("assignment").value=a.assignment_id;$("day").value=a.agenda_date;$("assignment").disabled=true;$("day").disabled=true;fields($("fields"),"f",a.content);$("submit").hidden=false} $("review").hidden=false;$("original").replaceChildren();for(const k of Object.keys(names)){el("h3",names[k],$("original"));el("pre",a.content[k]||"",$("original"))}fields($("revision"),"r",a.review_content||a.content);$("actions").replaceChildren();$("paper").replaceChildren();$("note").value=a.review_note||"";if(manager&&a.status==="submitted"){for(const [action,label] of [["approve","Aprovar revisão humana"],["return","Devolver ao professor"]])el("button",label,$("actions")).onclick=()=>run(async()=>{await api("/daily-entries","PATCH",{id:a.id,action,content:values("r"),note:$("note").value});await load()})}if(a.status==="approved"){el("h2",a.grade+" "+a.classroom+" · "+a.subject+" · "+a.agenda_date,$("paper"));for(const k of Object.keys(names)){el("h3",names[k],$("paper"));el("pre",a.review_content?.[k]||"",$("paper"))}el("button","Imprimir prévia individual",$("actions")).onclick=()=>window.print()}}
$("save").onclick=()=>run(async()=>{const content=values("f");if(selected&&["draft","needs_clarification"].includes(selected.status))await api("/daily-entries","PATCH",{id:selected.id,action:"save",content});else await api("/daily-entries","POST",{assignment_id:$("assignment").value,agenda_date:$("day").value,content});await load()});
$("submit").onclick=()=>run(async()=>{await api("/daily-entries","PATCH",{id:selected.id,action:"submit",content:values("f")});await load()});$("new").onclick=reset;$("refresh").onclick=()=>run(load);$("institution").onchange=()=>run(load);
run(async()=>{const r=await fetch(AUTH+"/token",{credentials:"include",cache:"no-store"});const d=await r.json();token=d.token||d.data?.token;if(!token)throw Error("Entre com sua conta central.");const root=await api();for(const i of root.institutions||[])option($("institution"),i.institution_id,i.name);await load()});
</script></html>
